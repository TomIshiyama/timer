name: Build/release Electron app

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: build-linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux

      - name: build-mac
        if: matrix.os == 'macos-latest'
        run: npm run build:mac

      - name: build-win
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## macOS でのインストール

            下の Assets から `-universal-mac.zip` で終わるファイルをダウンロードする。
            Apple Silicon と Intel の双方で動く。

            ブラウザでダウンロードした場合は、展開した `timer.app` を `アプリケーション` に移し、
            ターミナルで次を実行してから起動する。

            ```bash
            xattr -dr com.apple.quarantine /Applications/timer.app
            ```

            ターミナルだけで済ませる場合は、Assets の zip の URL をコピーして次を実行する。
            この経路なら上のコマンドは要らない。

            ```bash
            curl -L -o timer.zip <zip の URL>
            unzip timer.zip -d /Applications
            ```

            このアプリは Apple の証明書で署名していないため、
            ブラウザからダウンロードすると macOS が起動を止める。上の手順はそれを解除するもの。
          files: artifacts/*
